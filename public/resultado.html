<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Amigo Invisible 🎁</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="copos" id="copos"></div>
  <div class="contenedor">
    <header class="cabecera">
      <span class="emoji-grande">🎁</span>
      <h1 id="titulo-sorteo">Amigo Invisible</h1>
    </header>

    <div id="vista-cargando" class="cargando">❄</div>

    <div id="vista-resultado" class="oculto">
      <p id="saludo" class="texto-centro" style="font-size:1rem;color:var(--gris);margin-bottom:0.5rem"></p>
      <div class="tarjeta-resultado">
        <div class="etiqueta">Este año le toca regalar a</div>
        <div class="nombre-receptor" id="nombre-receptor"></div>
        <p style="font-size:0.9rem;color:var(--gris)">🤫 ¡Que nadie lo sepa!</p>
        <div id="mensaje-organizador" class="mensaje-organizador oculto"></div>
      </div>
      <p class="texto-centro mt-2" style="font-size:0.8rem;color:var(--gris)">
        Guarda el email con este enlace para volver a consultarlo.
      </p>
    </div>

    <div id="vista-pendiente" class="oculto">
      <div class="tarjeta" style="text-align:center">
        <span style="font-size:3rem">⏳</span>
        <h2 style="margin-top:1rem">El sorteo aún no ha sido lanzado</h2>
        <p style="color:var(--gris);margin-top:0.5rem">Vuelve más tarde cuando el organizador haya lanzado el sorteo.</p>
      </div>
    </div>

    <div id="vista-error" class="oculto">
      <div class="tarjeta" style="text-align:center">
        <span style="font-size:3rem">❌</span>
        <h2 style="margin-top:1rem">Enlace no válido</h2>
        <p style="color:var(--gris);margin-top:0.5rem">Este enlace no existe o ha caducado.</p>
      </div>
    </div>
  </div>

  <script>
    // Copos de nieve
    const coposEl = document.getElementById('copos');
    const simbolos = ['❄','❅','❆','✻','✼'];
    for (let i = 0; i < 25; i++) {
      const c = document.createElement('span'); c.className = 'copo';
      c.textContent = simbolos[Math.floor(Math.random() * simbolos.length)];
      c.style.left = Math.random() * 100 + '%';
      c.style.animationDuration = (4 + Math.random() * 9) + 's';
      c.style.animationDelay = (-Math.random() * 12) + 's';
      c.style.fontSize = (0.7 + Math.random() * 1.3) + 'rem';
      coposEl.appendChild(c);
    }

    function mostrar(id) {
      ['vista-cargando','vista-resultado','vista-pendiente','vista-error'].forEach(v => {
        document.getElementById(v).classList.toggle('oculto', v !== id);
      });
    }

    async function cargar() {
      const token = new URLSearchParams(location.search).get('token');
      if (!token) { mostrar('vista-error'); return; }

      try {
        const res = await fetch('/api/resultado/' + token);
        if (!res.ok) { mostrar('vista-error'); return; }
        const d = await res.json();

        if (d.estado === 'pendiente') {
          mostrar('vista-pendiente');
          return;
        }

        // Estado lanzado
        document.getElementById('titulo-sorteo').textContent = d.nombreSorteo || 'Amigo Invisible';
        document.getElementById('saludo').textContent = 'Hola, ' + d.nombre + ' 👋';
        document.getElementById('nombre-receptor').textContent = d.receptor;

        if (d.mensaje) {
          const msgEl = document.getElementById('mensaje-organizador');
          msgEl.textContent = '📌 ' + d.mensaje;
          msgEl.classList.remove('oculto');
        }

        mostrar('vista-resultado');
      } catch (err) {
        mostrar('vista-error');
      }
    }

    cargar();
  </script>
</body>
</html>
